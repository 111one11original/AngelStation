<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Angel Station</title>
    <style>
        * { box-sizing: border-box; user-select: none; -webkit-tap-highlight-color: transparent; }
        body { margin: 0; background: #0b0b0b; color: white; font-family: 'Segoe UI', Tahoma, sans-serif; overflow: hidden; height: 100vh; display: flex; flex-direction: column; }

        /* ЗАСТАВКА */
        #cinematic-intro { position: fixed; inset: 0; z-index: 1000; background: #000; display: flex; flex-direction: column; justify-content: center; align-items: center; overflow: hidden; transition: opacity 1s ease, visibility 1s; }
        #cinematic-intro.hidden { opacity: 0; visibility: hidden; }
        .intro-bg-glow { position: absolute; inset: 0; background: radial-gradient(circle at 50% 50%, rgba(255,107,53,0.1) 0%, transparent 70%); opacity: 0; animation: fadeInGlow 3s forwards; }
        @keyframes fadeInGlow { 0% { opacity: 0; } 100% { opacity: 1; } }
        .intro-logo-container { position: relative; z-index: 10; text-align: center; opacity: 0; animation: logoFadeIn 2s 0.5s forwards; }
        @keyframes logoFadeIn { 0% { opacity: 0; transform: scale(0.9) translateY(20px); filter: blur(10px); } 100% { opacity: 1; transform: scale(1) translateY(0); filter: blur(0); } }
        .intro-logo-text { font-size: 80px; font-weight: 900; letter-spacing: 10px; text-transform: uppercase; color: #fff; text-shadow: 0 0 20px rgba(255,107,53,0.8), 0 0 40px rgba(255,107,53,0.4); animation: textGlow 2s infinite alternate; }
        @keyframes textGlow { 0% { text-shadow: 0 0 20px rgba(255,107,53,0.8), 0 0 40px rgba(255,107,53,0.4); } 100% { text-shadow: 0 0 30px rgba(255,107,53,1), 0 0 60px rgba(255,107,53,0.6); } }
        .intro-subtitle { font-size: 16px; letter-spacing: 20px; color: #aaa; text-transform: uppercase; margin-top: 10px; opacity: 0; animation: fadeIn 1.5s 2s forwards; }
        @keyframes fadeIn { 0% { opacity: 0; } 100% { opacity: 1; } }
        .intro-loading-text { position: absolute; bottom: 100px; font-size: 14px; color: #666; letter-spacing: 3px; opacity: 0; animation: fadeIn 1s 4s forwards; }
        .intro-flash { position: absolute; inset: 0; background: #fff; opacity: 0; z-index: 20; pointer-events: none; animation: flashEffect 0.5s 5.5s forwards; }
        @keyframes flashEffect { 0% { opacity: 0; } 50% { opacity: 0.8; } 100% { opacity: 0; } }

        /* ИНТЕРФЕЙС */
        .topbar { height: 40px; background: #000; display: flex; justify-content: space-between; align-items: center; padding: 0 20px; font-size: 14px; color: #aaa; flex-shrink: 0; }
        .screen { flex: 1; display: none; flex-direction: column; animation: slideIn 0.3s ease; overflow-y: auto; }
        .screen.active { display: flex; }
        @keyframes slideIn { from { opacity: 0; transform: scale(0.95); } to { opacity: 1; transform: scale(1); } }

        .menu-grid { flex: 1; display: flex; justify-content: center; align-items: center; gap: 20px; }
        .tile { width: 180px; height: 220px; background: #1a1a1a; border-radius: 20px; display: flex; flex-direction: column; align-items: center; justify-content: center; border: 3px solid transparent; opacity: 0.6; transition: all 0.3s; cursor: pointer; text-decoration: none; color: white; }
        .tile:active { opacity: 1; transform: scale(1.05); }
        .tile.active { opacity: 1; border-color: #FF6B35; transform: scale(1.1); box-shadow: 0 0 30px rgba(255,107,53,0.4); }
        .icon { font-size: 60px; margin-bottom: 15px; }
        .label { font-weight: bold; font-size: 18px; letter-spacing: 1px; }

        .sub-header { padding: 20px; font-size: 20px; font-weight: bold; border-bottom: 1px solid #222; display: flex; align-items: center; justify-content: space-between; flex-shrink: 0; }
        .back-btn { background: #333; border: none; color: white; padding: 8px 16px; border-radius: 8px; cursor: pointer; font-size: 16px; }
        .exit-btn { background: #e74c3c; color: white; border: none; padding: 8px 16px; border-radius: 8px; cursor: pointer; font-size: 16px; font-weight: bold; }
        .content-list { padding: 20px; display: flex; flex-direction: column; gap: 15px; }

        .game-card { display: flex; background: #1a1a1a; border-radius: 15px; overflow: hidden; text-decoration: none; color: white; border: 2px solid transparent; transition: 0.2s; }
        .game-card:active { border-color: #FF6B35; transform: scale(0.98); }
        .game-cover { width: 100px; height: 100px; object-fit: cover; background: #333; }
        .game-info { padding: 15px; display: flex; flex-direction: column; justify-content: center; }
        .game-title { font-size: 18px; font-weight: bold; margin-bottom: 5px; }
        .game-desc { font-size: 12px; color: #888; }

        .setting-group { background: #111; border-radius: 15px; padding: 5px 15px; margin-bottom: 10px; }
        .setting-row { padding: 15px 0; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #222; cursor: pointer; }
        .setting-row:last-child { border-bottom: none; }
        .setting-row .val { color: #FF6B35; font-weight: bold; font-size: 16px; }
    </style>
</head>
<body>

    <!-- ЗАСТАВКА (с проверкой) -->
    <div id="cinematic-intro" style="display: none;">
        <div class="intro-bg-glow"></div>
        <div class="intro-logo-container">
            <div class="intro-logo-text">ANGEL</div>
            <div class="intro-subtitle">STATION</div>
        </div>
        <div class="intro-loading-text">LOADING...</div>
        <div class="intro-flash"></div>
    </div>

    <div class="topbar">
        <div id="clock">12:00</div>
        <div>Wi-Fi | 🔋 100%</div>
    </div>

    <!-- МЕНЮ -->
    <div id="screen-main" class="screen active">
        <div class="menu-grid">
            <div class="tile active" onclick="showScreen('screen-games')">
                <div class="icon">🎮</div><div class="label">Игры</div>
            </div>
            <!-- ИСПРАВЛЕНА ССЫЛКА НА БРАУЗЕР -->
            <a href="browser.html" class="tile">
                <div class="icon">🌐</div><div class="label">Браузер</div>
            </a>
            <div class="tile" onclick="showScreen('screen-settings')">
                <div class="icon">⚙️</div><div class="label">Настройки</div>
            </div>
        </div>
    </div>

    <!-- ИГРЫ -->
    <div id="screen-games" class="screen">
        <div class="sub-header">
            <button class="back-btn" onclick="showScreen('screen-main')">← Назад</button>
            <span>Мои Игры</span>
            <button class="exit-btn" onclick="showScreen('screen-main')">Выход</button>
        </div>
        <div class="content-list">
            <a href="legend_of_gerbil/index.html" class="game-card">
                <img src="legend_of_gerbil/icon.png" class="game-cover" alt="Иконка" onerror="this.style.display='none'">
                <div class="game-info">
                    <div class="game-title">Легенды Песчанок</div>
                    <div class="game-desc">Эпическое приключение в мире песка</div>
                </div>
            </a>
            <a href="1000_in_1/index.html" class="game-card">
                <img src="1000_in_1/icon.png" class="game-cover" alt="Иконка" onerror="this.style.display='none'">
                <div class="game-info">
                    <div class="game-title">1000 в 1</div>
                    <div class="game-desc">Сборник классических игр</div>
                </div>
            </a>
        </div>
    </div>

    <!-- НАСТРОЙКИ -->
    <div id="screen-settings" class="screen">
        <div class="sub-header">
            <button class="back-btn" onclick="showScreen('screen-main')">← Назад</button>
            <span>Настройки</span>
            <button class="exit-btn" onclick="showScreen('screen-main')">Выход</button>
        </div>
        <div class="content-list">
            <div class="setting-group">
                <div class="setting-row">
                    <div class="title">Версия системы</div>
                    <div class="val">Angel OS 1.0</div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Функция переключения экранов
        function showScreen(screenId) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.getElementById(screenId).classList.add('active');
        }

        // ЛОГИКА ЗАСТАВКИ: Показываем только если это первый запуск
        const isFirstRun = localStorage.getItem('angel_booted') === null;
        
        if (isFirstRun) {
            // Показываем заставку
            document.getElementById('cinematic-intro').style.display = 'flex';
            localStorage.setItem('angel_booted', 'true'); // Запоминаем, что показали
            
            // Скрываем её через 6 секунд
            setTimeout(() => {
                document.getElementById('cinematic-intro').classList.add('hidden');
                setTimeout(() => {
                    document.getElementById('cinematic-intro').style.display = 'none';
                }, 1000); // Ждем окончания анимации исчезновения
            }, 6000);
        }

        // Часы
        setInterval(() => {
            const d = new Date();
            document.getElementById('clock').textContent = 
                String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0');
        }, 1000);
    </script>
</body>
</html>
