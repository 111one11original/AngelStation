<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>1000 в 1 — Коллекция мини-игр</title>
<style>
    :root{
        --bg:#0a0e14; --bg2:#0f1520; --panel:#131b28; --panel2:#182233;
        --line:#233246; --line2:#2f425c;
        --txt:#dbe7f3; --dim:#8194ad; --dim2:#5a6c84;
        --acc:#4de1ff; --acc2:#7c6cff; --ok:#3ddc84; --warn:#ffc857; --bad:#ff5d73;
        --r:14px; --r-sm:10px;
        --shadow:0 10px 30px -10px rgba(0,0,0,.6);
        --glow:0 0 0 1px rgba(77,225,255,.25), 0 0 24px -6px rgba(77,225,255,.35);
    }
    *{box-sizing:border-box}
    html,body{height:100%}
    body{
        margin:0; font-family:'Segoe UI',system-ui,-apple-system,Roboto,Arial,sans-serif;
        background:
            radial-gradient(1100px 600px at 12% -8%, rgba(124,108,255,.14), transparent 60%),
            radial-gradient(900px 520px at 92% 4%, rgba(77,225,255,.12), transparent 55%),
            var(--bg);
        color:var(--txt); padding:20px 16px 72px; line-height:1.5;
        -webkit-font-smoothing:antialiased;
    }
    .wrap{max-width:940px;margin:0 auto}

    /* ---------- Шапка ---------- */
    .hero{text-align:center;margin-bottom:22px}
    .hero h1{
        margin:0 0 6px; font-size:clamp(26px,5vw,40px); font-weight:800; letter-spacing:-.02em;
        background:linear-gradient(100deg,#4de1ff,#7c6cff 55%,#4de1ff);
        -webkit-background-clip:text; background-clip:text; color:transparent;
    }
    .hero p{margin:0;color:var(--dim);font-size:14px}
    .hero .pill{
        display:inline-block;margin-top:10px;padding:5px 14px;font-size:12.5px;font-weight:600;
        color:var(--acc);background:rgba(77,225,255,.08);
        border:1px solid rgba(77,225,255,.25);border-radius:99px;
    }

    /* ---------- Панель управления ---------- */
    .controls{
        display:flex;flex-wrap:wrap;gap:10px;justify-content:center;align-items:center;
        background:linear-gradient(180deg,var(--panel),var(--panel2));
        border:1px solid var(--line);border-radius:var(--r);
        padding:14px;box-shadow:var(--shadow);margin-bottom:14px;
    }
    .field{position:relative;flex:1 1 190px;min-width:150px;max-width:230px}
    .field input{
        width:100%;padding:12px 14px;font-size:15px;font-family:inherit;
        color:var(--txt);background:var(--bg2);
        border:1px solid var(--line2);border-radius:var(--r-sm);outline:none;
        transition:.18s;
    }
    .field input::placeholder{color:var(--dim2)}
    .field input:focus{border-color:var(--acc);box-shadow:var(--glow)}

    button{
        font-family:inherit;font-size:14.5px;font-weight:600;cursor:pointer;
        padding:12px 18px;border-radius:var(--r-sm);
        color:var(--txt);background:var(--bg2);
        border:1px solid var(--line2);
        transition:.16s ease;white-space:nowrap;
    }
    button:hover:not(:disabled){border-color:var(--acc);color:#fff;transform:translateY(-1px)}
    button:active:not(:disabled){transform:translateY(0)}
    button:disabled{opacity:.4;cursor:not-allowed;transform:none}
    button.primary{
        background:linear-gradient(135deg,var(--acc),var(--acc2));
        border:none;color:#08121a;font-weight:800;
        box-shadow:0 6px 20px -8px rgba(77,225,255,.7);
    }
    button.primary:hover{filter:brightness(1.08);color:#08121a}
    button.ghost{background:transparent}

    /* ---------- Прогресс ---------- */
    .progress{
        display:flex;align-items:center;gap:12px;flex-wrap:wrap;
        padding:10px 16px;margin-bottom:16px;font-size:13.5px;color:var(--dim);
        background:var(--panel);border:1px solid var(--line);border-radius:var(--r-sm);
    }
    .progress b{color:var(--txt);font-weight:700}
    .pbar{flex:1;min-width:120px;height:7px;background:var(--bg2);
          border-radius:99px;overflow:hidden;border:1px solid var(--line)}
    .pbar>i{display:block;height:100%;width:0;
            background:linear-gradient(90deg,var(--ok),var(--acc));
            border-radius:99px;transition:width .4s ease}

    /* ---------- Карточка игры ---------- */
    .stage{
        background:linear-gradient(180deg,var(--panel),var(--panel2));
        border:1px solid var(--line);border-radius:var(--r);
        box-shadow:var(--shadow);overflow:hidden;
        animation:fade .3s ease;
    }
    @keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

    .stage-head{
        display:flex;justify-content:space-between;align-items:center;gap:12px;
        padding:16px 18px;border-bottom:1px solid var(--line);
        background:linear-gradient(90deg,rgba(77,225,255,.06),transparent);
        text-align:left;
    }
    .stage-head h2{
        margin:0;font-size:clamp(16px,2.6vw,20px);font-weight:800;color:#fff;
        display:flex;align-items:center;gap:10px;flex-wrap:wrap;letter-spacing:-.01em;
    }
    .num-badge{
        font-size:12.5px;font-weight:800;color:#08121a;padding:3px 10px;border-radius:99px;
        background:linear-gradient(135deg,var(--acc),var(--acc2));
    }
    .tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
    .tag{
        font-size:11.5px;font-weight:700;letter-spacing:.03em;text-transform:uppercase;
        padding:3px 9px;border-radius:99px;
        color:var(--acc);background:rgba(77,225,255,.09);
        border:1px solid rgba(77,225,255,.25);
    }
    .tag.won{color:#062b16;background:var(--ok);border-color:var(--ok)}
    .head-actions{display:flex;gap:6px;flex-shrink:0}
    .icon{
        width:38px;height:38px;padding:0;display:grid;place-items:center;
        font-size:16px;border-radius:10px;background:var(--bg2);border:1px solid var(--line2);
    }
    .icon:hover:not(:disabled){background:var(--line);border-color:var(--acc)}

    .stage-body{padding:22px 18px;min-height:300px;display:flex;align-items:center;justify-content:center}

    /* ---------- Общие стили мини-игр ---------- */
    .mg{width:100%;max-width:560px;text-align:center}
    .mg p{margin:10px 0}
    .mg .lead{font-size:15.5px;color:var(--dim)}
    .mg .lead b{color:var(--txt)}
    .row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin:16px 0}
    .mg input{
        padding:11px 14px;font-size:15px;font-family:inherit;text-align:center;
        color:var(--txt);background:var(--bg2);border:1px solid var(--line2);
        border-radius:var(--r-sm);outline:none;transition:.16s;
    }
    .mg input:focus{border-color:var(--acc);box-shadow:var(--glow)}
    .inp{width:150px;margin:0}
    .big{
        font-size:clamp(26px,6vw,38px);font-weight:800;letter-spacing:.04em;
        color:var(--acc);margin:16px 0;min-height:1.2em;
        text-shadow:0 0 30px rgba(77,225,255,.35);
    }
    .msg{min-height:26px;font-size:15.5px;font-weight:600;margin:12px 0 4px}
    .win{color:var(--ok)}
    .lose{color:var(--bad)}
    .hint{font-size:13px;color:var(--dim2)}

    .grid{display:grid;gap:9px;margin:18px auto;justify-content:center}
    .tile{
        aspect-ratio:1/1;display:grid;place-items:center;font-size:26px;font-weight:800;
        background:var(--bg2);border:2px solid var(--line2);border-radius:12px;
        cursor:pointer;transition:.14s;color:var(--txt);padding:0;
    }
    .tile:hover:not(:disabled){border-color:var(--acc);background:var(--line)}
    .tile.open{background:linear-gradient(135deg,var(--acc),var(--acc2));color:#08121a;border-color:transparent}
    .tile.done{opacity:.35;border-color:var(--ok);cursor:default}

    .pads{display:grid;grid-template-columns:repeat(2,96px);gap:12px;justify-content:center;margin:20px auto}
    .pad{
        height:96px;margin:0;border-radius:16px;border:3px solid var(--line2);
        opacity:.4;transition:.12s;cursor:pointer;
    }
    .pad.lit{opacity:1;transform:scale(1.06);box-shadow:0 0 26px currentColor}

    .bar-track{
        position:relative;height:38px;background:var(--bg2);
        border:1px solid var(--line2);border-radius:10px;
        margin:26px auto;max-width:100%;overflow:hidden;
    }
    .bar-zone{position:absolute;top:0;bottom:0;background:rgba(61,220,132,.18);
              border-left:2px solid var(--ok);border-right:2px solid var(--ok)}
    .bar-runner{position:absolute;top:0;bottom:0;width:6px;border-radius:3px;
                background:var(--acc);box-shadow:0 0 14px var(--acc)}

    .arena{
        position:relative;height:270px;border-radius:12px;margin:16px 0;
        background:
            radial-gradient(circle at 50% 50%, rgba(77,225,255,.06), transparent 70%),
            var(--bg2);
        border:1px solid var(--line2);overflow:hidden;
    }
    .target{
        position:absolute;width:52px;height:52px;border-radius:50%;
        background:radial-gradient(circle at 35% 30%, #8dffb8, var(--ok));
        color:#062b16;font-size:24px;border:none;cursor:pointer;padding:0;
        display:grid;place-items:center;
        box-shadow:0 0 20px rgba(61,220,132,.6);
        transition:transform .1s;
    }
    .target:active{transform:scale(.9)}

    .board3{display:grid;grid-template-columns:repeat(3,84px);gap:9px;justify-content:center;margin:18px auto}
    .board3 button{height:84px;font-size:36px;font-weight:800;margin:0;padding:0;
                   background:var(--bg2);border:2px solid var(--line2);border-radius:12px}
    .board3 button:hover:not(:disabled){border-color:var(--acc)}

    /* ---------- Тосты ---------- */
    .toast{
        position:fixed;left:50%;bottom:24px;transform:translate(-50%,20px);
        padding:13px 24px;border-radius:12px;font-weight:700;font-size:14.5px;
        color:#062b16;background:linear-gradient(135deg,#7dffb0,var(--ok));
        box-shadow:0 12px 30px -8px rgba(61,220,132,.6);
        opacity:0;pointer-events:none;transition:.28s;z-index:80;
    }
    .toast.show{opacity:1;transform:translate(-50%,0)}

    /* ---------- Модалка со списком ---------- */
    .overlay{
        position:fixed;inset:0;background:rgba(4,8,14,.82);backdrop-filter:blur(6px);
        display:none;align-items:center;justify-content:center;padding:16px;z-index:90;
    }
    .overlay.show{display:flex}
    .modal{
        width:min(980px,100%);height:min(86vh,860px);
        background:linear-gradient(180deg,var(--panel),var(--panel2));
        border:1px solid var(--line2);border-radius:18px;
        display:flex;flex-direction:column;padding:16px;box-shadow:var(--shadow);
        animation:fade .22s ease;
    }
    .modal-head{display:flex;gap:10px;align-items:center;margin-bottom:12px}
    .modal-head h3{margin:0;font-size:17px;white-space:nowrap}
    .modal-head input{
        flex:1;padding:11px 14px;font-size:14.5px;font-family:inherit;
        color:var(--txt);background:var(--bg2);border:1px solid var(--line2);
        border-radius:var(--r-sm);outline:none;min-width:0;
    }
    .modal-head input:focus{border-color:var(--acc);box-shadow:var(--glow)}
    .modal-body{flex:1;overflow:auto;padding-right:6px}
    .list-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(72px,1fr));gap:7px}
    .list-grid button{
        padding:11px 4px;font-size:14px;font-weight:700;margin:0;
        background:var(--bg2);border:1px solid var(--line);border-radius:9px;color:var(--dim);
    }
    .list-grid button:hover:not(:disabled){border-color:var(--acc);color:var(--txt)}
    .list-grid button.won{color:#062b16;background:var(--ok);border-color:var(--ok)}
    .list-grid button.fav::after{content:'★';margin-left:3px;color:var(--warn)}
    .list-grid button.current{outline:2px solid var(--acc);outline-offset:1px}

    .modal-body::-webkit-scrollbar{width:8px}
    .modal-body::-webkit-scrollbar-thumb{background:var(--line2);border-radius:99px}

    /* ---------- Адаптив ---------- */
    @media(max-width:600px){
        body{padding:14px 10px 60px}
        .controls{padding:12px;gap:8px}
        .field{flex:1 1 100%;max-width:none}
        .controls .btn-row{display:flex;gap:8px;width:100%}
        .controls .btn-row button{flex:1;padding:11px 8px;font-size:13px}
        .stage-body{padding:16px 12px}
        .board3{grid-template-columns:repeat(3,72px)}
        .board3 button{height:72px;font-size:30px}
        .pads{grid-template-columns:repeat(2,84px)}
        .pad{height:84px}
        .head-actions .icon{width:34px;height:34px;font-size:14px}
        .modal-head{flex-wrap:wrap}
        .modal-head h3{width:100%}
    }
</style>
</head>
<body>
<div class="wrap">

    <header class="hero">
        <h1>1000 в 1</h1>
        <p>Коллекция из 1000 уникальных мини-игр</p>
        <span class="pill">22 механики · 1000 неповторяющихся вариантов</span>
    </header>

    <div class="controls">
        <div class="field">
            <input type="number" id="num" min="1" max="1000" placeholder="Номер игры 1–1000">
        </div>
        <button class="primary" id="playBtn">▶ Играть</button>
        <button id="randBtn">🎲 Случайная</button>
        <button id="unwonBtn">🎯 Непройденная</button>
        <button class="ghost" id="listBtn">📋 Все игры</button>
    </div>

    <div class="progress">
        <span>Пройдено: <b id="wonCount">0</b> / 1000</span>
        <div class="pbar"><i id="pbarFill"></i></div>
        <span>★ <b id="favCount">0</b></span>
    </div>

    <section class="stage" id="stage">
        <div class="stage-head" id="stageHead"></div>
        <div class="stage-body" id="stageBody"></div>
    </section>
</div>

<div class="overlay" id="overlay">
    <div class="modal">
        <div class="modal-head">
            <h3>Все игры</h3>
            <input id="search" placeholder="Поиск по номеру или типу…">
            <button class="icon" id="closeBtn" title="Закрыть">✕</button>
        </div>
        <div class="modal-body"><div class="list-grid" id="listGrid"></div></div>
    </div>
</div>

<div class="toast" id="toast"></div>

<script>
/* ============================================================
   БАЗОВЫЕ УТИЛИТЫ
   ============================================================ */
const $ = (s, r = document) => r.querySelector(s);
const el = (tag, cls, txt) => {
    const e = document.createElement(tag);
    if (cls) e.className = cls;
    if (txt != null) e.textContent = txt;
    return e;
};
const esc = s => String(s).replace(/[&<>"']/g, c =>
    ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
const rndInt = (a, b) => a + Math.floor(Math.random() * (b - a + 1));
const pick = arr => arr[Math.floor(Math.random() * arr.length)];

/* Детерминированные ГПСЧ */
function hash32(n) {
    let x = n | 0;
    x = Math.imul(x ^ (x >>> 16), 0x45d9f3b);
    x = Math.imul(x ^ (x >>> 16), 0x45d9f3b);
    x = x ^ (x >>> 16);
    return x >>> 0;
}
function mulberry32(a) {
    return function () {
        a |= 0; a = (a + 0x6D2B79F5) | 0;
        let t = Math.imul(a ^ (a >>> 15), 1 | a);
        t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
        return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
}
const pickRng = (rng, arr) => arr[Math.floor(rng() * arr.length)];

/* ============================================================
   ХРАНИЛИЩЕ
   ============================================================ */
const store = {
    won: new Set(), fav: new Set(),
    load() {
        try {
            this.won = new Set(JSON.parse(localStorage.getItem('mg1000_won') || '[]'));
            this.fav = new Set(JSON.parse(localStorage.getItem('mg1000_fav') || '[]'));
        } catch (e) {}
    },
    save() {
        try {
            localStorage.setItem('mg1000_won', JSON.stringify([...this.won]));
            localStorage.setItem('mg1000_fav', JSON.stringify([...this.fav]));
        } catch (e) {}
    }
};

/* ============================================================
   ГЕНЕРАТОР НАЗВАНИЙ — уникальные имена без повторов
   ============================================================ */
const ADJ = ['Неоновый','Тёмный','Космический','Забытый','Хрустальный','Огненный',
    'Ледяной','Цифровой','Древний','Бархатный','Звёздный','Тайный','Быстрый',
    'Лунный','Стальной','Изумрудный','Багровый','Туманный','Пиксельный','Грозовой',
    'Скрытый','Медный','Серебряный','Морской','Пепельный','Янтарный','Фантомный',
    'Кибернетический','Забытый','Солнечный'];
const NOUN = ['рассвет','лабиринт','кристалл','предел','шторм','прилив','секрет',
    'механизм','портал','импульс','горизонт','сигнал','артефакт','рубеж','вихрь',
    'маяк','код','разлом','вектор','контур','архив','фрагмент','узел','канал',
    'якорь','круг','ключ','след','мост','эхо'];

/* ============================================================
   МЕХАНИКИ
   ============================================================ */
const MECHANICS = [];
const mech = (id, name, make) => MECHANICS.push({ id, name, make });

/* 1. Угадай число */
mech('guess', 'Угадай число', rng => {
    const max = pickRng(rng, [50, 100, 200, 500, 1000]);
    const secret = 1 + Math.floor(rng() * max);
    const limit = max >= 500 ? Math.ceil(Math.log2(max)) + 3 : 0;
    return {
        html: `<p class="lead">Я загадал число от <b>1</b> до <b>${max}</b>${limit ? `, попыток: <b>${limit}</b>` : ''}.</p>
               <div class="row">
                 <input type="number" class="inp" data-k="in" placeholder="Число">
                 <button class="primary" data-k="go">Проверить</button>
               </div>
               <p class="msg" data-k="msg">&nbsp;</p><p class="hint" data-k="tries"></p>`,
        init(root, api) {
            const inp = $('[data-k=in]', root), msg = $('[data-k=msg]', root), tr = $('[data-k=tries]', root);
            let tries = 0, over = false;
            const go = () => {
                if (over) return;
                const v = parseInt(inp.value, 10);
                if (isNaN(v) || v < 1 || v > max) { msg.textContent = `Введи от 1 до ${max}`; return; }
                tries++;
                if (v === secret) {
                    over = true;
                    msg.innerHTML = `<span class="win">Победа! Число ${secret}. Попыток: ${tries}</span>`;
                    api.win();
                } else if (limit && tries >= limit) {
                    over = true;
                    msg.innerHTML = `<span class="lose">Попытки кончились. Было ${secret}.</span>`;
                } else {
                    msg.textContent = v < secret ? 'Больше ↑' : 'Меньше ↓';
                }
                tr.textContent = `Попыток: ${tries}${limit ? ' / ' + limit : ''}`;
                inp.value = ''; inp.focus();
            };
            $('[data-k=go]', root).onclick = go;
            inp.onkeydown = e => { if (e.key === 'Enter') go(); };
            inp.focus();
        }
    };
});

/* 2. Больше или меньше */
mech('hl', 'Больше или меньше', rng => {
    const rounds = pickRng(rng, [4, 5, 6]);
    const need = rounds - 1;
    return {
        html: `<p class="lead">Угадай, больше или меньше следующее число. Раундов: <b>${rounds}</b>, нужно <b>${need}</b>.</p>
               <div class="big" data-k="cur">?</div>
               <div class="row">
                 <button data-k="up">↑ Больше</button>
                 <button data-k="down">↓ Меньше</button>
               </div>
               <p class="msg" data-k="msg">&nbsp;</p><p class="hint" data-k="score"></p>`,
        init(root, api) {
            let i = 0, score = 0, cur = rndInt(1, 99);
            const curEl = $('[data-k=cur]', root), msg = $('[data-k=msg]', root),
                  sc = $('[data-k=score]', root), up = $('[data-k=up]', root), down = $('[data-k=down]', root);
            curEl.textContent = cur;
            const play = guess => {
                if (i >= rounds) return;
                let next = rndInt(1, 99);
                while (next === cur) next = rndInt(1, 99);
                const ok = guess === 'up' ? next > cur : next < cur;
                if (ok) score++;
                i++;
                msg.innerHTML = (ok ? '<span class="win">Верно!</span>' : '<span class="lose">Мимо!</span>') +
                                ` Было ${cur}, стало ${next}.`;
                cur = next; curEl.textContent = cur;
                sc.textContent = `Счёт: ${score} / ${i}`;
                if (i >= rounds) {
                    up.disabled = down.disabled = true;
                    if (score >= need) { msg.innerHTML += ' <span class="win">Победа!</span>'; api.win(); }
                    else msg.innerHTML += ` <span class="lose">Нужно ${need} из ${rounds}.</span>`;
                }
            };
            up.onclick = () => play('up');
            down.onclick = () => play('down');
        }
    };
});

/* 3. КНБ */
mech('rps', 'Камень, ножницы, бумага', rng => {
    const five = rng() < 0.4;
    const target = rng() < 0.5 ? 2 : 3;
    const moves = five ? ['rock','paper','scissors','lizard','spock'] : ['rock','paper','scissors'];
    const label = { rock:'✊ Камень', paper:'✋ Бумага', scissors:'✌️ Ножницы',
                    lizard:'🦎 Ящерица', spock:'🖖 Спок' };
    const beats = five ? {
        rock:['scissors','lizard'], paper:['rock','spock'],
        scissors:['paper','lizard'], lizard:['spock','paper'], spock:['rock','scissors']
    } : { rock:['scissors'], paper:['rock'], scissors:['paper'] };
    return {

mech('react', 'Тест реакции', rng => {
    const rounds = pickRng(rng, [3, 5]);
    const threshold = pickRng(rng, [280, 320, 360, 400]);
    return {
        html: `<p class="lead">${rounds} раунда. Среднее должно быть ≤ <b>${threshold} мс</b>.</p>
               <button data-k="pad" style="width:100%;height:130px;font-size:20px;font-weight:700">Нажми «Старт»</button>
               <p class="msg" data-k="msg">&nbsp;</p>`,
        init(root, api) {
            const pad = $('[data-k=pad]', root), msg = $('[data-k=msg]', root);
            let state = 'idle', t0 = 0, times = [], timer = null;
            const set = (txt, bg, fg) => {
                pad.textContent = txt;
                pad.style.background = bg;
                pad.style.color = fg;
                pad.style.borderColor = fg === '#0f0' ? '#0f0' : '#233246';
            };
            pad.onclick = () => {
                if (state === 'idle') {
                    state = 'wait';
                    set('Жди зелёного…', 'var(--bg2)', 'var(--txt)');
                    msg.innerHTML = '&nbsp;';
                    timer = setTimeout(() => {
                        state = 'ready';
                        t0 = performance.now();
                        set('ЖМИ!', 'linear-gradient(135deg,#3ddc84,#4de1ff)', '#08121a');
                    }, 900 + Math.random() * 2500);
                } else if (state === 'wait') {
                    clearTimeout(timer);
                    state = 'idle'; times = [];
                    set('Рано! Нажми «Старт»', 'var(--bg2)', 'var(--txt)');
                    msg.innerHTML = '<span class="lose">Ты поспешил — серия сброшена.</span>';
                } else if (state === 'ready') {
                    const dt = Math.round(performance.now() - t0);
                    times.push(dt);
                    state = 'idle';
                    if (times.length >= rounds) {
                        const avg = Math.round(times.reduce((a, b) => a + b, 0) / times.length);
                        set('Ещё раз', 'var(--bg2)', 'var(--txt)');
                        if (avg <= threshold) { msg.innerHTML = `<span class="win">Среднее ${avg} мс — победа!</span>`; api.win(); }
                        else msg.innerHTML = `<span class="lose">Среднее ${avg} мс, нужно ≤ ${threshold}.</span>`;
                        times = [];
                    } else {
                        set(`Ещё (${times.length}/${rounds})`, 'var(--bg2)', 'var(--txt)');
                        msg.innerHTML = `Реакция: <b>${dt} мс</b>`;
                    }

            };
            return () => { if (timer) clearTimeout(timer); };
        }
    };
});

mech('math', 'Быстрая математика', rng => {
    const diff = Math.floor(rng() * 3);
    const ops = diff === 0 ? ['+','-'] : diff === 1 ? ['+','-','×'] : ['+','-','×','÷'];
    const total = 5, need = 4;
    return {
        html: `<p class="lead">${total} примеров. Нужно минимум <b>${need}</b> верных.</p>
               <div class="big" data-k="task">&nbsp;</div>
               <div class="row">
                 <input type="number" class="inp" data-k="ans" placeholder="Ответ">
                 <button class="primary" data-k="ok">Ответить</button>
               </div>
               <p class="msg" data-k="msg">&nbsp;</p><p class="hint" data-k="prog"></p>`,
        init(root, api) {
            const task = $('[data-k=task]', root), ans = $('[data-k=ans]', root),
                  ok = $('[data-k=ok]', root), msg = $('[data-k=msg]', root), prog = $('[data-k=prog]', root);
            let i = 0, score = 0, cur = null;
            const gen = () => {
                const op = pick(ops);
                let a, b, r;
                if (op === '+') { a = rndInt(10, 30 + diff * 50); b = rndInt(10, 30 + diff * 50); r = a + b; }
                else if (op === '-') { a = rndInt(20, 40 + diff * 60); b = rndInt(1, a - 1); r = a - b; }
                else if (op === '×') { a = rndInt(2, 4 + diff * 4); b = rndInt(2, 4 + diff * 4); r = a * b; }
                else { b = rndInt(2, 9); r = rndInt(2, 9); a = b * r; }
                return { t: `${a} ${op} ${b} = ?`, r };
            };
            const next = () => {
                if (i >= total) {
                    task.textContent = 'Готово!';
                    ans.disabled = ok.disabled = true;
                    if (score >= need) { msg.innerHTML = `<span class="win">Победа: ${score}/${total}</span>`; api.win(); }
                    else msg.innerHTML = `<span class="lose">Результат: ${score}/${total}</span>`;
                    return;
                }
                cur = gen(); i++;
                task.textContent = cur.t;
                prog.textContent = `Вопрос ${i}/${total} · Верно: ${score}`;
                ans.value = ''; ans.focus();
            };
            const submit = () => {
                if (!cur) return;
                const v = parseInt(ans.value, 10);
                if (isNaN(v)) return;
                if (v === cur.r) { score++; msg.innerHTML = '<span class="win">Верно!</span>'; }
                else msg.innerHTML = `<span class="lose">Нет, ответ: ${cur.r}</span>`;
                cur = null;
                setTimeout(next, 500);
            };
            ok.onclick = submit;
            ans.onkeydown = e => { if (e.key === 'Enter') submit(); };
            next();
        }
    };
});

mech('mem', 'Мемори', rng => {
    const [cols, rows] = pickRng(rng, [[4,3],[4,4],[5,4]]);
    const pairs = (cols * rows) / 2;
    const pool = ['🍎','🍌','🍇','🍓','🍒','🍑','🥝','🍍','🥑','🍉','🍊','🍋','🥥','🍐','🍄','🌻','⭐','💎','🎈','🎲'];
    const picks = [];
    const copy = [...pool];
    for (let i = 0; i < pairs; i++) picks.push(copy.splice(Math.floor(rng() * copy.length), 1)[0]);
    const limit = Math.round(pairs * 2.2);
    return {
        html: `<p class="lead">Найди все пары. Лимит ходов: <b>${limit}</b>.</p>
               <div class="grid" data-k="grid" style="grid-template-columns:repeat(${cols},minmax(0,1fr));max-width:${cols * 76}px"></div>
               <p class="msg" data-k="msg">&nbsp;</p><p class="hint" data-k="info">Ходов: 0</p>`,
        init(root, api) {
            const grid = $('[data-k=grid]', root), msg = $('[data-k=msg]', root), info = $('[data-k=info]', root);
            const cards = [...picks, ...picks].map(v => ({ v, open: false, done: false }));
            for (let i = cards.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [cards[i], cards[j]] = [cards[j], cards[i]];
            }
            let openIdx = [], moves = 0, lock = false, found = 0;
            cards.forEach((c, idx) => {
                const b = el('button', 'tile', '?');
                b.onclick = () => {
                    if (lock || c.open || c.done) return;
                    c.open = true;
                    b.textContent = c.v;
                    b.classList.add('open');
                    openIdx.push(idx);
                    if (openIdx.length === 2) {
                        const [a, b2] = openIdx;
                        moves++;
                        info.textContent = `Ходов: ${moves}`;
                        if (cards[a].v === cards[b2].v) {
                            cards[a].done = cards[b2].done = true;
                            found++;
                            grid.children[a].classList.add('done');
                            grid.children[b2].classList.add('done');
                            openIdx = [];
                            if (found === pairs) {
                                if (moves <= limit) { msg.innerHTML = `<span class="win">Все пары за ${moves} ходов — победа!</span>`; api.win(); }
                                else msg.innerHTML = `<span class="lose">Пары найдены, но ходов ${moves} > ${limit}</span>`;
                            }
                        } else {
                            lock = true;
                            setTimeout(() => {
                                for (const k of [a, b2]) {
                                    cards[k].open = false;
                                    grid.children[k].textContent = '?';
                                    grid.children[k].classList.remove('open');
                                }
                                openIdx = [];
                                lock = false;
                            }, 700);
                        }
                    }
                };
                grid.appendChild(b);
            });
        }
    };
});

mech('simon', 'Повтори последовательность', () => {
    const colors = ['#ff5d73','#3ddc84','#4d8aff','#ffc857'];
    return {
        html: `<p class="lead">Повтори последовательность огней. 3 раунда — длина растёт.</p>
               <div class="pads" data-k="pads"></div>
               <div class="row"><button class="primary" data-k="start">Старт</button></div>
               <p class="msg" data-k="msg">Нажми «Старт»</p>`,
        init(root, api) {
            const pads = $('[data-k=pads]', root), msg = $('[data-k=msg]', root),
                  btnStart = $('[data-k=start]', root);
            const btns = colors.map(c => {
                const b = el('button', 'pad');
                b.style.background = c;
                b.style.color = c;
                pads.appendChild(b);
                return b;
            });
            let seq = [], input = [], round = 0, playing = false, timers = [];
            const flash = (i, ms) => {
                const b = btns[i];
                b.classList.add('lit');
                timers.push(setTimeout(() => b.classList.remove('lit'), ms || 380));
            };
            const playSeq = () => {
                playing = true;
                msg.textContent = 'Смотри…';
                input = [];
                seq.forEach((v, k) => timers.push(setTimeout(() => flash(v), 600 * k)));
                timers.push(setTimeout(() => {
                    playing = false;
                    msg.textContent = 'Повтори!';
                }, 600 * seq.length + 200));
            };
            const startRound = () => {
                round++;
                if (round > 3) {
                    msg.innerHTML = '<span class="win">Все раунды пройдены — победа!</span>';
                    api.win();
                    return;
                }
                seq = [];
                for (let i = 0; i < round + 2; i++) seq.push(rndInt(0, 3));
                msg.textContent = `Раунд ${round}/3 · длина ${seq.length}`;
                timers.push(setTimeout(playSeq, 700));
            };
            btns.forEach((b, i) => {
                b.onclick = () => {
                    if (playing || !seq.length) return;
                    flash(i, 160);
                    input.push(i);
                    const k = input.length - 1;
                    if (input[k] !== seq[k]) {
                        msg.innerHTML = '<span class="lose">Ошибка! Нажми «Старт» заново.</span>';
                        seq = []; round = 0; input = [];
                        return;
                    }
                    if (input.length === seq.length) {
                        playing = true;
                        msg.textContent = 'Верно!';
                        timers.push(setTimeout(() => { playing = false; startRound(); }, 600));
                    }
                };
            });
            btnStart.onclick = () => {
                timers.forEach(clearTimeout);
                timers = [];
                round = 0; seq = []; input = []; playing = false;
                startRound();
            };
            return () => timers.forEach(clearTimeout);
        }
    };
});

                  ok = $('[data-k=ok]', root), msg = $('[data-k=msg]', root), prog = $('[data-k=prog]', root);
            let i = 0, score = 0, answer = 0, over = false;
            const gen = () => {
                const type = rndInt(0, 3);
                const arr = [];
                if (type === 0) {
                    const a = rndInt(1, 20), d = rndInt(2, 9);
                    for (let k = 0; k < 5; k++) arr.push(a + d * k);
                } else if (type === 1) {
                    const a = rndInt(1, 5), r = rndInt(2, 4);
                    for (let k = 0; k < 5; k++) arr.push(a * Math.pow(r, k));
                } else if (type === 2) {
                    const a = rndInt(1, 10);
                    for (let k = 0; k < 5; k++) arr.push((a + k) * (a + k));
                } else {
                    let x = rndInt(1, 5), y = rndInt(2, 8);
                    for (let k = 0; k < 5; k++) { arr.push(x); [x, y] = [y, x + y]; }
                }
                answer = arr.pop();
                return arr;
            };

                if (i >= rounds) {
                    task.textContent = 'Готово!';
                    inp.disabled = ok.disabled = true;

                    else msg.innerHTML = `<span class="lose">Результат: ${score}/${rounds}</span>`;
                    return;

mech('ttt', 'Крестики-нолики', () => {
    return {
        html: `<p class="lead">Ты — ❌. Собери три в ряд раньше бота.</p>
               <div class="board3" data-k="board"></div>
               <p class="msg" data-k="msg">&nbsp;</p>
               <div class="row"><button data-k="reset">Заново</button></div>`,
        init(root, api) {
            const boardEl = $('[data-k=board]', root), msg = $('[data-k=msg]', root),
                  resetBtn = $('[data-k=reset]', root);
            const lines = [[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];
            let board, over;
            const winner = b => {
                for (const [a, c, d] of lines) {
                    if (b[a] && b[a] === b[c] && b[a] === b[d]) return b[a];
                }
                return b.every(x => x) ? 'draw' : null;
            };
            const botMove = b => {
                for (const p of ['O','X']) {
                    for (const [a, c, d] of lines) {
                        const v = [b[a], b[c], b[d]];
                        if (v.filter(x => x === p).length === 2 && v.includes('')) {
                            return [a, c, d][v.indexOf('')];
                        }
                    }
                }
                if (!b[4]) return 4;
                const corners = [0,2,6,8].filter(i => !b[i]);
                if (corners.length) return pick(corners);
                const empty = b.map((v, i) => v ? null : i).filter(i => i !== null);
                return pick(empty);
            };
            const render = () => {
                boardEl.innerHTML = '';
                board.forEach((v, i) => {
                    const b = el('button', '', v || '');
                    b.onclick = () => move(i);
                    boardEl.appendChild(b);
                });
            };
            const finish = res => {
                over = true;
                if (res === 'X') { msg.innerHTML = '<span class="win">Ты победил!</span>'; api.win(); }
                else if (res === 'O') msg.innerHTML = '<span class="lose">Бот победил.</span>';
                else msg.innerHTML = '<span class="win">Ничья.</span>';
            };
            const move = i => {
                if (over || board[i]) return;
                board[i] = 'X';
                let res = winner(board);
                if (res) { render(); finish(res); return; }
                render();
                msg.textContent = 'Бот думает…';
                setTimeout(() => {
                    const bm = botMove(board);
                    board[bm] = 'O';
                    render();
                    res = winner(board);
                    if (res) finish(res);
                    else msg.innerHTML = '&nbsp;';
                }, 350);
            };
            const reset = () => {
                board = Array(9).fill('');
                over = false;
                msg.innerHTML = '&nbsp;';
                render();
            };
            resetBtn.onclick = reset;
            reset();
        }
    };
});

                    if (!options.includes(c)) options.push(c);
                }
                for (let k = options.length - 1; k > 0; k--) {
                    const j = Math.floor(Math.random() * (k + 1));
                    [options[k], options[j]] = [options[j], options[k]];
                }
                opts.innerHTML = '';
                options.forEach(c => {
                    const b = el('button', '', c);
                    b.onclick = () => {
                        if (lock) return;
                        lock = true;
                        if (c === capital) { score++; msg.innerHTML = '<span class="win">Верно!</span>'; }
                        else msg.innerHTML = `<span class="lose">Нет, это ${capital}</span>`;
                        i++;
                        prog.textContent = `Верно: ${score} / ${i}`;
                        setTimeout(next, 650);
                    };
                    opts.appendChild(b);
                });
                prog.textContent = `Верно: ${score} / ${i} · Вопрос ${i + 1}/5`;
            };
            next();
        }
    };
});

/* 22. Останови полосу */
mech('bar', 'Останови полосу', rng => {
    const speed = 0.8 + rng() * 0.9;
    const zoneW = 12 + rng() * 8;
    const zoneStart = 20 + rng() * 55;
    const attempts = 3, need = 2;
    return {
        html: `<p class="lead">Останови бегунок в зоне. ${attempts} попытки, нужно ${need} попадания.</p>
               <div class="bar-track" data-k="wrap">
                 <div class="bar-zone" data-k="zone" style="left:${zoneStart}%;width:${zoneW}%"></div>
                 <div class="bar-runner" data-k="bar" style="left:0"></div>
               </div>
               <div class="row"><button class="primary" data-k="stop">СТОП</button></div>
               <p class="msg" data-k="msg">&nbsp;</p><p class="hint" data-k="prog"></p>`,
        init(root, api) {
            const bar = $('[data-k=bar]', root), stopBtn = $('[data-k=stop]', root),
                  msg = $('[data-k=msg]', root), prog = $('[data-k=prog]', root);
            let pos = 0, dir = 1, hits = 0, used = 0, running = true;
            const timer = setInterval(() => {
                if (!running) return;
                pos += dir * speed;
                if (pos >= 100) { pos = 100; dir = -1; }
                if (pos <= 0) { pos = 0; dir = 1; }
                bar.style.left = pos + '%';
            }, 16);
            stopBtn.onclick = () => {
                if (!running) return;
                used++;
                const inZone = pos >= zoneStart && pos <= zoneStart + zoneW;
                if (inZone) { hits++; msg.innerHTML = '<span class="win">Попадание!</span>'; }
                else msg.innerHTML = '<span class="lose">Мимо.</span>';
                prog.textContent = `Попаданий: ${hits} / ${used}`;
                if (hits >= need) {
                    running = false; stopBtn.disabled = true;
                    msg.innerHTML = '<span class="win">Победа!</span>'; api.win();
                } else if (used >= attempts) {
                    running = false; stopBtn.disabled = true;
                    msg.innerHTML = '<span class="lose">Попытки кончились.</span>';
                }
            };
            return () => clearInterval(timer);
        }
    };
});

/* ============================================================
   ГЕНЕРАЦИЯ 1000 УНИКАЛЬНЫХ ИГР
   ------------------------------------------------------------
   Алгоритм:
   1) Для каждого номера детерминированный rng.
   2) Механика выбирается по кругу с перемешиванием, чтобы
      каждая механика встречалась примерно 1000/22 раз.
   3) Название строится так, чтобы ВСЕ 1000 имён были уникальны
      (проверка через Set + перебор комбинаций).
   4) Signature (механика + html-структура + ключевые параметры)
      кладётся в Set — если совпал, добавляем суффикс-параметр,
      чтобы игры гарантированно не повторялись.
   ============================================================ */
const ADJ_L = ADJ.length, NOUN_L = NOUN.length;
const TOTAL_NAMES = ADJ_L * NOUN_L;
const M = MECHANICS.length;
const SLOTS_PER_M = Math.floor(1000 / M);   // 45
const REMAINDER = 1000 - SLOTS_PER_M * M;   // 10

const USED_NAMES = new Set();
const USED_SIGS = new Set();
const META = {};

function makeUniqueName(baseName, seed) {
    // Быстрая попытка: ADJ[seed % ADJ] + NOUN[seed % NOUN]
    const rng = mulberry32(hash32(seed * 2654435761 + 7));
    for (let attempt = 0; attempt < TOTAL_NAMES * 2; attempt++) {
        const adj = ADJ[Math.floor(rng() * ADJ_L)];
        const noun = NOUN[Math.floor(rng() * NOUN_L)];
        const name = `${baseName}: ${adj} ${noun}`;
        if (!USED_NAMES.has(name)) { USED_NAMES.add(name); return name; }
    }
    // Fallback с номером — гарантированно уникально
    let n = 1, name;
    do { name = `${baseName} №${seed}-${n++}`; } while (USED_NAMES.has(name));
    USED_NAMES.add(name);
    return name;
}

/* Выбираем для каждого номера механику так, чтобы распределение было ровным */
function buildAssignment() {
    const assignment = new Array(1001);   // 1-based
    const order = [];
    for (let pass = 0; pass <= SLOTS_PER_M; pass++) {
        for (let m = 0; m < M; m++) order.push(m);
    }
    // Перемешиваем детерминированно
    const rng = mulberry32(hash32(99991));
    for (let i = order.length - 1; i > 0; i--) {
        const j = Math.floor(rng() * (i + 1));
        [order[i], order[j]] = [order[j], order[i]];
    }
    for (let n = 1; n <= 1000; n++) assignment[n] = order[n - 1];
    return assignment;
}

function buildAll() {
    const assignment = buildAssignment();

    for (let num = 1; num <= 1000; num++) {
        const mIdx = assignment[num];
        const m = MECHANICS[mIdx];

        // Детерминированный rng, уникальный для каждого номера
        let sig = '';
        let cfg = null;
        let rng = null;
        let attempt = 0;
        // Пытаемся получить неповторяющуюся сигнатуру
        do {
            const seed = hash32(num * 2654435761 + attempt * 2246822519 + mIdx * 3266489917);
            rng = mulberry32(seed);
            try {
                cfg = m.make(rng, num);
                sig = m.id + '::' + cfg.html;
            } catch (e) {
                cfg = null;
                sig = '';
            }
            attempt++;
            if (attempt > 6) break;
        } while (USED_SIGS.has(sig));

        USED_SIGS.add(sig);

        META[num] = {
            mIdx,
            mechId: m.id,
            mechName: m.name,
            cfg,
            sig
        };
    }

    // Названия — уникальные
    for (let num = 1; num <= 1000; num++) {
        const meta = META[num];
        meta.title = makeUniqueName(meta.mechName, num);
    }
}

/* Сборка объекта игры on-demand (кэш) */
const gameCache = new Map();
function buildGame(num) {
    if (gameCache.has(num)) return gameCache.get(num);
    const meta = META[num];
    const g = {
        num,
        mechId: meta.mechId,
        mechName: meta.mechName,
        title: meta.title,
        html: meta.cfg.html,
        init: meta.cfg.init
    };
    gameCache.set(num, g);
    return g;
}

/* ============================================================
   UI
   ============================================================ */
const stage = $('#stage');
const stageHead = $('#stageHead');
const stageBody = $('#stageBody');
const toastEl = $('#toast');
const wonCountEl = $('#wonCount');
const favCountEl = $('#favCount');
const pbarFill = $('#pbarFill');
const modal = $('#overlay');
const listGrid = $('#listGrid');
const searchInp = $('#search');
const numInput = $('#num');

let currentNum = 0;
let cleanup = null;
let toastTimer = null;

function toast(text) {
    toastEl.textContent = text;
    toastEl.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => toastEl.classList.remove('show'), 1800);
}

function updateStats() {
    wonCountEl.textContent = store.won.size;
    favCountEl.textContent = store.fav.size;
    pbarFill.style.width = (store.won.size / 10) + '%';
    // Обновим кнопки в списке
    for (const b of listGrid.children) {
        const n = +b.dataset.n;
        b.classList.toggle('won', store.won.has(n));
        b.classList.toggle('fav', store.fav.has(n));
        b.classList.toggle('current', n === currentNum);
    }
}

function setGame(num) {
    num = Math.min(1000, Math.max(1, num | 0));
    if (cleanup) { try { cleanup(); } catch (e) {} cleanup = null; }

    currentNum = num;
    numInput.value = num;

    let g;
    try {
        g = buildGame(num);
    } catch (e) {
        console.error(e);
        stageHead.innerHTML = '<h2>Ошибка</h2>';
        stageBody.innerHTML = '<p class="lose">Не удалось загрузить игру №' + num + '</p>';
        return;
    }

    const won = store.won.has(num);
    const fav = store.fav.has(num);

    stageHead.innerHTML =
        '<div>' +
            '<h2><span class="num-badge">№' + num + '</span> ' + esc(g.title) + '</h2>' +
            '<div class="tags">' +
                '<span class="tag">' + esc(g.mechName) + '</span>' +
                (won ? '<span class="tag won">Пройдено</span>' : '') +
            '</div>' +
        '</div>' +
        '<div class="head-actions">' +
            '<button class="icon" data-h="fav" title="В избранное">' + (fav ? '★' : '☆') + '</button>' +
            '<button class="icon" data-h="again" title="Заново">↻</button>' +
            '<button class="icon" data-h="rand" title="Случайная">🎲</button>' +
        '</div>';

    stageHead.querySelector('[data-h=fav]').onclick = () => {
        if (store.fav.has(num)) store.fav.delete(num); else store.fav.add(num);
        store.save();
        updateStats();
        setGame(num);
    };
    stageHead.querySelector('[data-h=again]').onclick = () => setGame(num);
    stageHead.querySelector('[data-h=rand]').onclick = () => randomGame();

    stageBody.innerHTML = '<div class="mg">' + g.html + '</div>';
    const root = stageBody.firstElementChild;

    const api = {
        num,
        win() {
            const first = !store.won.has(num);
            store.won.add(num);
            store.save();
            updateStats();
            const tags = stageHead.querySelector('.tags');
            if (tags && !tags.querySelector('.tag.won')) {
                const s = document.createElement('span');
                s.className = 'tag won';
                s.textContent = 'Пройдено';
                tags.appendChild(s);
            }
            toast(first ? `✅ Игра №${num} пройдена!` : `✅ Победа в игре №${num}`);
        }
    };

    try {
        cleanup = g.init(root, api) || null;
    } catch (e) {
        console.error(e);
        root.innerHTML = '<p class="lose">Внутренняя ошибка игры.</p>';
    }

    updateStats();
    stage.scrollIntoView({ behavior: 'smooth', block: 'start' });
}

/* ---- Кнопки меню ---- */
$('#playBtn').onclick = () => {
    const v = parseInt(numInput.value, 10);
    if (isNaN(v) || v < 1 || v > 1000) { toast('Введите число от 1 до 1000'); return; }
    setGame(v);
};
numInput.onkeydown = e => { if (e.key === 'Enter') $('#playBtn').click(); };

function randomGame() {
    setGame(1 + Math.floor(Math.random() * 1000));
}
function randomUnwon() {
    const pool = [];
    for (let i = 1; i <= 1000; i++) if (!store.won.has(i)) pool.push(i);
    if (!pool.length) { toast('🏆 Все 1000 игр пройдены!'); return; }
    setGame(pick(pool));
}
$('#randBtn').onclick = randomGame;
$('#unwonBtn').onclick = randomUnwon;

/* ---- Модальное окно ---- */
function buildModal() {
    const frag = document.createDocumentFragment();
    for (let i = 1; i <= 1000; i++) {
        const b = el('button', '', String(i));
        b.dataset.n = i;
        b.title = META[i].mechName;
        if (store.won.has(i)) b.classList.add('won');
        if (store.fav.has(i)) b.classList.add('fav');
        b.onclick = () => { closeModal(); setGame(i); };
        frag.appendChild(b);
    }
    listGrid.appendChild(frag);
}
function openModal() { modal.classList.add('show'); updateStats(); }
function closeModal() { modal.classList.remove('show'); }
$('#listBtn').onclick = openModal;
$('#closeBtn').onclick = closeModal;
modal.addEventListener('click', e => { if (e.target === modal) closeModal(); });
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });

searchInp.addEventListener('input', e => {
    const q = e.target.value.trim().toLowerCase();
    for (const b of listGrid.children) {
        const n = b.dataset.n;
        const match = !q || n.includes(q) || META[n].mechName.toLowerCase().includes(q);
        b.style.display = match ? '' : 'none';
    }
});

/* ============================================================
   СТАРТ
   ============================================================ */
store.load();
buildAll();
buildModal();
updateStats();
setGame(1);
</script>
